<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMO სამუშაო ანგარიში</title>
<style>
:root{--bg:#071117;--panel:#0d1b24;--panel2:#10232f;--text:#eef7f7;--muted:#9fb0b8;--green:#18c98b;--red:#ef5b67;--blue:#2999df;--line:#1e3542}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#061015,#0a1821);color:var(--text)}
.app{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:28px;color:#62e4b5}header small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:18px}
.card .label{color:var(--muted);font-size:14px}.amount{font-size:30px;font-weight:bold;margin-top:10px}.blue{border-color:#1b4d6c}.green{border-color:#17684d}.red{border-color:#6e2931}
.add{width:100%;margin:16px 0;padding:18px;border:0;border-radius:16px;background:linear-gradient(90deg,#119c72,#22d59a);color:white;font-size:19px;font-weight:bold;cursor:pointer}
.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.section h2{margin:0 0 14px;font-size:20px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;margin:9px 0;background:#0a151d;border:1px solid #1a2c37;border-radius:14px}
.meta{color:var(--muted);font-size:13px;margin-top:5px}.right{text-align:right}.status{font-size:13px;font-weight:bold;margin-top:7px}.paid{color:#4fe2a4}.unpaid{color:#ff7c84}
button.small{background:#183445;color:white;border:1px solid #285269;border-radius:9px;padding:7px 10px;margin-left:5px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:28px}
.modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}
.form{width:min(480px,100%);background:#0c1a23;border:1px solid #28404d;border-radius:20px;padding:20px}
.form h2{margin-top:0}label{display:block;margin:12px 0 5px;color:#c7d4d8}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #29404c;background:#071117;color:white;font-size:16px}
.row{display:flex;gap:10px;margin-top:18px}.save{flex:1;background:var(--green);border:0;border-radius:10px;padding:14px;color:#062016;font-weight:bold;font-size:16px}.cancel{background:#20323b;color:white;border:0;border-radius:10px;padding:14px}
footer{text-align:center;color:#71838c;font-size:12px;margin:22px 0 5px}
@media(max-width:650px){.app{padding:12px}header h1{font-size:23px}.grid{grid-template-columns:1fr 1fr}.grid .card:first-child{grid-column:1/-1}.amount{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>TEMO სამუშაო ანგარიში</h1><small>ჩემი სამუშაო და გადახდები</small></div><div id="today"></div></header>

<div class="grid">
<div class="card blue"><div class="label">🔨 სულ ნამუშევარი</div><div class="amount" id="total">€0</div><div class="meta" id="days">0 დღე</div></div>
<div class="card green"><div class="label">💶 მიღებული</div><div class="amount" id="paid">€0</div><div class="meta" id="paidDays">0 გადახდილი</div></div>
<div class="card red"><div class="label">⏳ მისაღები</div><div class="amount" id="unpaid">€0</div><div class="meta" id="unpaidDays">0 გადასახდელი</div></div>
</div>

<button class="add" onclick="openForm()">＋ სამუშაოს დამატება</button>

<div class="section">
<h2>ბოლო სამუშაოები</h2>
<div id="list"></div>
</div>
<footer>TEMO WORK TRACKER • მონაცემები ამ ტელეფონში ინახება</footer>
</div>

<div class="modal" id="modal">
<div class="form">
<h2>სამუშაოს დამატება</h2>
<label>თარიღი</label><input id="date" type="date">
<label>სამუშაო ადგილი / დამსაქმებელი</label><input id="place" placeholder="მაგ: გიორგი - ვილა">
<label>თანხა (€)</label><input id="money" type="number" inputmode="decimal" placeholder="მაგ: 100">
<label>შენიშვნა</label><textarea id="note" rows="3" placeholder="სურვილის შემთხვევაში"></textarea>
<div class="row"><button class="cancel" onclick="closeForm()">გაუქმება</button><button class="save" onclick="saveJob()">შენახვა</button></div>
</div>
</div>

<script>
let jobs=JSON.parse(localStorage.getItem('temoJobs')||'[]');
const €=n=>'€'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
document.getElementById('today').textContent=new Date().toLocaleDateString('ka-GE');

function render(){
 let total=jobs.reduce((a,j)=>a+Number(j.money),0);
 let paid=jobs.filter(j=>j.paid).reduce((a,j)=>a+Number(j.money),0);
 let unpaid=total-paid, pd=jobs.filter(j=>j.paid).length, ud=jobs.length-pd;
 totalEl.textContent=€(total); paidEl.textContent=€(paid); unpaidEl.textContent=€(unpaid);
 days.textContent=jobs.length+' დღე'; paidDays.textContent=pd+' გადახდილი'; unpaidDays.textContent=ud+' გადასახდელი';
 list.innerHTML=jobs.length?'': '<div class="empty">ჯერ სამუშაო არ გაქვს დამატებული</div>';
 jobs.sort((a,b)=>b.date.localeCompare(a.date)).forEach(j=>{
  const d=document.createElement('div'); d.className='item';
  d.innerHTML=`<div><b>${j.place||'სამუშაო'}</b><div class="meta">${formatDate(j.date)}${j.note?' • '+j.note:''}</div></div>
  <div class="right"><b>${€(j.money)}</b><div class="status ${j.paid?'paid':'unpaid'}">${j.paid?'✓ გადახდილია':'● არ გადაუხდია'}</div>
  <button class="small" onclick="togglePaid('${j.id}')">${j.paid?'გაუქმება':'გადახდა მივიღე'}</button><button class="small" onclick="delJob('${j.id}')">✕</button></div>`;
  list.appendChild(d);
 });
}
const totalEl=document.getElementById('total'),paidEl=document.getElementById('paid'),unpaidEl=document.getElementById('unpaid');
function formatDate(s){if(!s)return '';let [y,m,d]=s.split('-');return d+'.'+m+'.'+y}
function openForm(){modal.classList.add('show');date.value=new Date().toISOString().slice(0,10)}
function closeForm(){modal.classList.remove('show')}
function saveJob(){
 if(!money.value||Number(money.value)<=0){alert('თანხა მიუთითე');return}
 jobs.push({id:Date.now().toString(),date:date.value,place:place.value,money:Number(money.value),note:note.value,paid:false});
 localStorage.setItem('temoJobs',JSON.stringify(jobs)); closeForm(); place.value='';money.value='';note.value='';render();
}
function togglePaid(id){let j=jobs.find(x=>x.id===id);j.paid=!j.paid;localStorage.setItem('temoJobs',JSON.stringify(jobs));render()}
function delJob(id){if(confirm('წავშალოთ ეს ჩანაწერი?')){jobs=jobs.filter(x=>x.id!==id);localStorage.setItem('temoJobs',JSON.stringify(jobs));render()}}
render();
</script>
</body></html>
